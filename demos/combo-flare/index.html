<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PixiJS combo meter flare (NixieFX) - demo</title>
<script type="importmap">
{ "imports": {
  "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.mjs",
  "nixie-fx/export": "https://esm.sh/nixie-fx@0.1.17/export?external=pixi.js",
  "nixie-fx/pixi": "https://esm.sh/nixie-fx@0.1.17/pixi?external=pixi.js" } }
</script>
<style>
  html, body { margin: 0; background: #151320; color: #e3ddf0; font: 14px system-ui, sans-serif; }
  main { max-width: 560px; margin: 16px auto; padding: 0 16px; }
  #stage canvas { display: block; width: 100%; height: auto; border-radius: 8px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid #6b5f8c; background: #231f33; color: inherit; cursor: pointer; }
  #stats { font: 12px ui-monospace, monospace; color: #a99fbf; }
</style>
</head>
<body>
<main>
  <div id="stage"></div>
  <div class="row">
    <button id="hit">Hit (or press Space)</button>
    <label><input type="checkbox" id="hyst" checked /> hysteresis: re-arm at 7</label>
    <label><input type="checkbox" id="rm" /> reduce motion</label>
  </div>
  <p id="stats"></p>
</main>
<script type="module">
import { Application, Graphics, Text } from "pixi.js";
import { loadVfxExportBundle } from "nixie-fx/export";
import { PixiVfxRenderer, createPixiVfx2dProjection } from "nixie-fx/pixi";
import { createCombo } from "./combo-logic.js";

const getJson = (p) => fetch(new URL(`./vfx/${p}`, import.meta.url)).then((r) => r.json());
const manifest = await getJson("manifest.json");
const effectsByPath = {};
for (const { path } of manifest.effects) effectsByPath[path] = await getJson(path);
const flare = loadVfxExportBundle({ manifest, effectsByPath }, { requiredBackend: "pixi2d", requiredEffectIds: ["combo-flare"] })
  .effectsById.get("combo-flare");

const W = 520, H = 160, BAR_X = 40, BAR_W = 440, MAX = 15, THRESHOLD = 10;
const app = new Application();
await app.init({ width: W, height: H, background: "#151320", antialias: true });
document.querySelector("#stage").appendChild(app.canvas);

const track = new Graphics().roundRect(BAR_X, 80, BAR_W, 20, 10).fill("#2a2638");
const fill = new Graphics();
const mark = new Graphics().rect(BAR_X + BAR_W * (THRESHOLD / MAX) - 1, 72, 2, 36).fill("#e8e2f4");
const label = new Text({ text: "", style: { fill: "#cfc8e0", fontSize: 20, fontWeight: "700", fontFamily: "system-ui" } });
label.position.set(BAR_X, 40);
app.stage.addChild(track, fill, mark, label);

const vfx = new PixiVfxRenderer({
  parent: app.stage,
  projection: createPixiVfx2dProjection({ originX: 0, originY: 0, pixelsPerUnit: 100, yAxis: "down" }),
});
const osReduce = matchMedia("(prefers-reduced-motion: reduce)");
const rmBox = document.querySelector("#rm");
rmBox.checked = osReduce.matches;
const reduceMotion = () => rmBox.checked || osReduce.matches;

let combo = makeCombo();
let flares = 0;
const live = new Set();
function makeCombo() { return createCombo({ threshold: THRESHOLD, rearmAt: document.querySelector("#hyst").checked ? 7 : 9 }); }
document.querySelector("#hyst").addEventListener("change", () => { combo = makeCombo(); flares = 0; });

function hit() {
  if (!combo.hit()) return;
  flares++;
  if (reduceMotion()) return; // the bar color and label still change, see draw()
  const x = BAR_X + BAR_W * (THRESHOLD / MAX);
  live.add(vfx.createEffect(flare, { position: [x / 100, 0.9, 0], seed: flares }));
}
document.querySelector("#hit").addEventListener("click", hit);
addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); hit(); } });

const stats = document.querySelector("#stats");
app.ticker.add((ticker) => {
  const dt = ticker.deltaMS / 1000;
  combo.update(dt);
  const v = combo.value, ready = v >= THRESHOLD;
  fill.clear().roundRect(BAR_X, 80, BAR_W * Math.min(1, v / MAX), 20, 10).fill(ready ? "#ff7ab0" : "#ffcf6a");
  label.text = ready ? `COMBO x${v}` : `combo ${v}`;
  label.style.fill = ready ? "#ffd1e4" : "#cfc8e0";
  const s = vfx.update(dt);
  for (const fx of live) if (!fx.isActive) { vfx.removeEffect(fx, true); live.delete(fx); }
  stats.textContent = `flares this round: ${flares} · armed: ${combo.armed ? "yes" : "no"} · ${s.activeParticles} particles${reduceMotion() ? " · reduced motion" : ""}`;
});
</script>
</body>
</html>
